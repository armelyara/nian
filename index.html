<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Nian</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  :root{
    --bg:#080a0b; --ground:#161819; --panel:#1C1F20;
    --border:rgba(255,255,255,.14); --border2:rgba(255,255,255,.26);
    --txt:#B8C4C2; --faint:#6f7c80;
    --accent:#E78D38; --accent2:#D97B22; --blue:#2E5FA3; --blue2:#74A5CC; --red:#e5443b;
    --font:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden}
  #scene{position:fixed;inset:0;z-index:1}
  #feedlines{position:fixed;inset:0;z-index:5;pointer-events:none}
  #feeds{position:fixed;inset:0;z-index:6;pointer-events:none}
  /* ---- feed video card ---- */
  .feedcard{position:absolute;pointer-events:auto;transform:translate(-50%,-50%);transition:opacity .35s ease;
    width:236px;background:var(--panel);border:1px solid var(--border2);box-shadow:0 8px 22px rgba(0,0,0,.55);cursor:pointer}
  .feedcard .vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
  .feedcard video{width:100%;height:100%;object-fit:cover;display:block}
  .feedcard .live{position:absolute;top:6px;left:6px;font-size:8px;letter-spacing:.12em;color:#fff;background:var(--red);padding:2px 6px}
  .feedcard .plat{position:absolute;top:6px;right:6px;font-size:8px;letter-spacing:.06em;color:var(--txt);background:rgba(0,0,0,.6);padding:2px 6px}
  .feedcard .vts{position:absolute;bottom:6px;left:6px;font-size:8px;color:#dfe8e6;background:rgba(0,0,0,.6);padding:2px 6px;letter-spacing:.04em}
  .feedcard .cap{font-size:10px;line-height:1.4;color:var(--txt);padding:7px 9px;max-height:40px;overflow:hidden}
  /* ---- top bar ---- */
  header#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    padding:9px 14px;background:linear-gradient(180deg,rgba(8,10,11,.94),rgba(8,10,11,.35))}
  #topbar .brand{font-size:15px;letter-spacing:.42em;color:var(--accent);font-weight:700}
  #topbar select,#topbar input{background:var(--panel);border:1px solid var(--border);color:var(--txt);
    font-family:var(--font);font-size:11px;padding:5px 8px;outline:none;color-scheme:dark;accent-color:var(--accent)}
  .tbtn{background:var(--panel);border:1px solid var(--border);color:var(--txt);font-family:var(--font);
    font-size:10px;letter-spacing:.1em;padding:6px 11px;cursor:pointer}
  .tbtn.on{background:var(--accent);color:#1a1205;border-color:var(--accent)}
  /* ---- left panel ---- */
  aside#leftpanel{position:fixed;top:52px;left:0;bottom:30px;z-index:18;width:300px;max-width:84vw;
    background:rgba(22,24,25,.9);border-right:1px solid var(--border2);backdrop-filter:blur(10px);
    transform:translateX(0);transition:transform .3s ease;overflow-y:auto}
  aside#leftpanel.collapsed{transform:translateX(-100%)}
  #panelToggle{position:fixed;top:60px;left:0;z-index:19;background:var(--panel);border:1px solid var(--border2);border-left:0;
    color:var(--accent);font-family:var(--font);font-size:14px;padding:8px 7px;cursor:pointer;transition:left .3s ease}
  #panelToggle.shift{left:300px}
  .lp-pad{padding:14px 15px}
  .lp-h{font-size:9px;letter-spacing:.2em;color:var(--blue2);margin:14px 0 6px}
  .lp-title{font-size:16px;letter-spacing:.06em;color:var(--accent)}
  .srcrow{display:flex;justify-content:space-between;font-size:11px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  footer#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:17;display:flex;gap:18px;justify-content:center;
    padding:6px 14px;background:linear-gradient(0deg,rgba(8,10,11,.94),rgba(8,10,11,.2));font-size:10px;letter-spacing:.1em}
  footer .cnt{color:var(--faint)} footer .cnt b{font-weight:700}
  #orbitbtn{position:fixed;right:16px;bottom:38px;z-index:20;background:var(--panel);border:1px solid var(--border2);
    color:var(--txt);font-family:var(--font);font-size:10px;letter-spacing:.1em;padding:7px 12px;cursor:pointer}
  /* ---- city view ---- */
  #cityview{position:fixed;inset:0;z-index:25;background:radial-gradient(circle at 50% 50%,#12161a,#080a0b);display:none}
  #cityview.show{display:block}
  #citysvg{position:absolute;inset:0;width:100%;height:100%}
  #citymarks{position:absolute;inset:0;z-index:27}
  #cityhead{position:absolute;top:58px;left:24px;z-index:28}
  #cityhead .ct{font-size:20px;letter-spacing:.14em;color:var(--accent)}
  #backglobe{margin-top:10px;background:transparent;border:1px solid var(--accent);color:var(--accent);
    font-family:var(--font);font-size:10px;letter-spacing:.12em;padding:8px 12px;cursor:pointer}
  #backglobe:hover{background:var(--accent);color:#1a1205}
  /* ---- inspector ---- */
  #inspector{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(4,6,7,.8);backdrop-filter:blur(4px)}
  #inspector.show{display:flex}
  .insp-card{width:720px;max-width:94vw;background:var(--panel);border:1px solid var(--border2);box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .insp-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:11px;letter-spacing:.1em;color:var(--accent);border-bottom:1px solid var(--border)}
  .insp-ctrls{display:flex;gap:8px;padding:8px 14px}
  .insp-ctrls button{background:transparent;border:1px solid var(--border2);color:var(--txt);font-family:var(--font);font-size:10px;padding:5px 10px;cursor:pointer}
  .insp-meta{padding:4px 14px 16px;font-size:11px;color:var(--txt);line-height:1.6}
  .insp-meta .cap2{color:var(--txt);margin-bottom:4px}
  .insp-meta .auth{color:var(--blue2)}
  .insp-meta a{color:var(--accent)}
</style>
</head>
<body>
<div id="scene"></div>
<svg id="feedlines"></svg>
<div id="feeds"></div>

<header id="topbar">
  <span class="brand">NIAN</span>
  <select id="catsel" title="Thème"><option value="all">Tout</option><option>Concerts</option><option>Manifestations</option><option>Incidents</option><option>Tech</option></select>
  <select id="citysel" title="Ville"><option value="all">Toutes les villes</option></select>
  <input id="timesel" type="datetime-local" title="Avant"/>
  <button class="tbtn" id="freezebtn">FREEZE</button>
</header>

<button id="panelToggle">❮</button>
<aside id="leftpanel"><div class="lp-pad" id="lpbody">
  <div class="lp-title">NIAN</div><div class="lp-h">ÉTAT</div>
  <div style="font-size:11px;color:var(--faint)">Sélectionne une ville (clic sur le globe) ou un flux.</div>
</div></aside>

<footer id="bottombar"></footer>
<button id="orbitbtn">ORBITE : LENTE</button>

<div id="cityview">
  <svg id="citysvg"></svg>
  <div id="citymarks"></div>
  <div id="cityhead"><div class="ct" id="cityname">VILLE</div><button id="backglobe">← RETOUR GLOBE</button></div>
</div>

<div id="inspector"></div>

<script>
/* ---------------- Config & demo data ---------------- */
const VBASE = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/";
const VIDEOS = ["BigBuckBunny", "ElephantsDream", "ForBiggerBlazes", "ForBiggerEscapes", "ForBiggerFun",
  "ForBiggerJoyrides", "ForBiggerMeltdowns", "Sintel", "SubaruOutbackOnStreetAndDirt", "TearsOfSteel",
  "VolkswagenGTIReview", "WhatCarCanYouGetForAGrand"];
window.INDICE_GEO_CONFIG = {
  cities: {
    "Singapour": { lat: 1.3521, lon: 103.8198 },
    "Abidjan": { lat: 5.3599, lon: -4.0083 },
    "Montréal": { lat: 45.5019, lon: -73.5674 },
    "Paris": { lat: 48.8566, lon: 2.3522 },
    "Tokyo": { lat: 35.6762, lon: 139.6503 }
  },
  categories: ["Concerts", "Manifestations", "Incidents", "Tech"],
  catColor: { "Concerts": "#E78D38", "Manifestations": "#D97B22", "Incidents": "#e5443b", "Tech": "#74A5CC" },
  feeds: []
};
(function seed() {
  const C = window.INDICE_GEO_CONFIG.cities, cats = window.INDICE_GEO_CONFIG.categories;
  const srcs = ["X", "Instagram", "TikTok", "YouTube"], auth = ["@live_report", "@onsite_cam", "@city_pulse", "@field_stream"];
  const caps = { "Paris": "Place de la République — cortège en direct", "Abidjan": "Le Plateau — Bd Houphouët-Boigny, trafic",
    "Singapour": "Marina Bay — foule en soirée", "Montréal": "Quartier des spectacles — scène live", "Tokyo": "Shibuya — carrefour en direct" };
  let i = 0; const out = [];
  Object.keys(C).forEach(city => {
    for (let k = 0; k < 2; k++) {
      i++;
      out.push({ id: "seed" + i, source: srcs[i % srcs.length], city: city,
        lat: C[city].lat + (Math.random() - .5) * .08, lon: C[city].lon + (Math.random() - .5) * .08,
        category: cats[i % cats.length], text: caps[city] || (city + " — flux en direct"),
        author: auth[i % auth.length], url: "",
        video: VBASE + VIDEOS[i % VIDEOS.length] + ".mp4",
        ts: new Date(Date.now() - Math.random() * 6e6).toISOString().slice(0, 19).replace("T", " ") });
    }
  });
  window.INDICE_GEO_CONFIG.feeds = out;
})();

/* ---------------- Helpers ---------------- */
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function safeUrl(u) { u = u || ""; const s = u.slice(0, 8).toLowerCase(); return (s.indexOf("http://") === 0 || s.indexOf("https://") === 0) ? u : "#"; }
const MONTHS = ["JAN", "FÉV", "MAR", "AVR", "MAI", "JUIN", "JUIL", "AOÛT", "SEP", "OCT", "NOV", "DÉC"];
function fmtTs(ts) { const d = new Date(String(ts || "").replace(" ", "T")); if (isNaN(d.getTime())) return esc(ts || ""); const p = n => String(n).padStart(2, "0"); return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear() + " • " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds()); }

/* ---------------- Three globe ---------------- */
const R = 2, S = { frozen: false, autoRotate: true, city: null, _down: null };
let scene, camera, renderer, controls, globe, cityMeshes = [], spikeGroup;

function llToVec(lat, lon, r) { const phi = (90 - lat) * Math.PI / 180, th = (lon + 180) * Math.PI / 180; return new THREE.Vector3(-r * Math.sin(phi) * Math.cos(th), r * Math.cos(phi), r * Math.sin(phi) * Math.sin(th)); }
function globeTexture(geo) {
  const W = 2048, H = 1024, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  ctx.fillStyle = "#0c1113"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(120,132,138,0.06)"; ctx.lineWidth = 1;
  for (let lon = -180; lon <= 180; lon += 30) { const x = (lon + 180) / 360 * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let lat = -90; lat <= 90; lat += 30) { const y = (90 - lat) / 180 * H; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  const proj = p => [(p[0] + 180) / 360 * W, (90 - p[1]) / 180 * H];
  ctx.fillStyle = "#3e4447"; ctx.strokeStyle = "#78848a"; ctx.lineWidth = 1.1;
  (geo.features || []).forEach(f => {
    const g = f.geometry; if (!g) return;
    const polys = g.type === "Polygon" ? [g.coordinates] : g.type === "MultiPolygon" ? g.coordinates : [];
    polys.forEach(poly => { ctx.beginPath(); poly.forEach(ring => ring.forEach((pt, i) => { const q = proj(pt); if (i === 0) ctx.moveTo(q[0], q[1]); else ctx.lineTo(q[0], q[1]); })); ctx.closePath(); ctx.fill(); ctx.stroke(); });
  });
  const t = new THREE.CanvasTexture(cv); t.anisotropy = 4; return t;
}
function initThree(geo) {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100); camera.position.set(0, 1.4, 5.2);
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
  document.getElementById("scene").appendChild(renderer.domElement);
  const sg = new THREE.BufferGeometry(), N = 1600, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const v = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(40 + Math.random() * 30); pos[i * 3] = v.x; pos[i * 3 + 1] = v.y; pos[i * 3 + 2] = v.z; }
  sg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0x8aa0a4, size: 0.08, transparent: true, opacity: .5 })));
  globe = new THREE.Mesh(new THREE.SphereGeometry(R, 64, 64), new THREE.MeshBasicMaterial({ map: globeTexture(geo) })); scene.add(globe);
  const atm = new THREE.Mesh(new THREE.SphereGeometry(R * 1.06, 48, 48), new THREE.ShaderMaterial({
    transparent: true, side: THREE.BackSide, blending: THREE.AdditiveBlending,
    vertexShader: "varying vec3 vN; void main(){ vN=normalize(normalMatrix*normal); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} ",
    fragmentShader: "varying vec3 vN; void main(){ float i=pow(0.62-dot(vN,vec3(0,0,1.0)),2.0); gl_FragColor=vec4(0.45,0.60,0.75,1.0)*i*0.9; }"
  })); scene.add(atm);
  spikeGroup = new THREE.Group(); scene.add(spikeGroup);
  Object.keys(window.INDICE_GEO_CONFIG.cities).forEach(city => {
    const c = window.INDICE_GEO_CONFIG.cities[city];
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.032, 12, 12), new THREE.MeshBasicMaterial({ color: 0xE78D38 }));
    m.position.copy(llToVec(c.lat, c.lon, R * 1.01)); m.userData.city = city; cityMeshes.push(m); scene.add(m);
  });
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = 3; controls.maxDistance = 9;
  controls.autoRotate = true; controls.autoRotateSpeed = 0.35; controls.enablePan = false;
  addEventListener("resize", onResize);
  renderer.domElement.addEventListener("pointerdown", e => { S._down = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener("pointerup", onPointerUp);
  rebuildActivity(); animate();
}
function onResize() { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); }
function onPointerUp(e) {
  if (S.city || !S._down) { S._down = null; return; }
  const moved = Math.hypot(e.clientX - S._down.x, e.clientY - S._down.y); S._down = null;
  if (moved > 6) return;
  const r = renderer.domElement.getBoundingClientRect();
  const mouse = new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(cityMeshes);
  if (hit.length) openCity(hit[0].object.userData.city);
}
function activeCities() { const set = {}; filtered().forEach(f => set[f.city] = (set[f.city] || 0) + 1); return set; }
function rebuildActivity() {
  if (!spikeGroup) return;
  while (spikeGroup.children.length) spikeGroup.remove(spikeGroup.children[0]);
  const act = activeCities(), cfg = window.INDICE_GEO_CONFIG;
  Object.keys(act).forEach(city => {
    const c = cfg.cities[city]; if (!c) return;
    const base = llToVec(c.lat, c.lon, R), top = llToVec(c.lat, c.lon, R + 0.12 + Math.min(act[city], 6) * 0.05);
    const g = new THREE.BufferGeometry().setFromPoints([base, top]);
    spikeGroup.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xE78D38, transparent: true, opacity: .9 })));
  });
}

/* ---------------- Filters ---------------- */
function filtered() {
  const cat = document.getElementById("catsel").value, city = document.getElementById("citysel").value, tv = document.getElementById("timesel").value;
  const tmax = tv ? new Date(tv).getTime() : null;
  return (window.INDICE_GEO_CONFIG.feeds || []).filter(f => {
    if (cat !== "all" && f.category !== cat) return false;
    if (city !== "all" && f.city !== city) return false;
    if (tmax && new Date(String(f.ts || "").replace(" ", "T")).getTime() > tmax) return false;
    return true;
  });
}

/* ---------------- Feed video card ---------------- */
function buildFeedCard(f) {
  const el = document.createElement("div"); el.className = "feedcard"; el.dataset.id = f.id;
  el.innerHTML = `<div class="vwrap"><video src="${esc(f.video)}" autoplay muted loop playsinline preload="auto"></video>
    <div class="live">● LIVE</div><div class="plat">${esc(f.source)} · ${esc(f.city)}</div><div class="vts">${fmtTs(f.ts)}</div></div>
    <div class="cap">${esc(f.text)}</div>`;
  el._video = el.querySelector("video");
  el.addEventListener("click", (ev) => { ev.stopPropagation(); openInspector(f); });
  return el;
}

/* ---------------- Globe overlay + anti-collision ---------------- */
const cardEls = {};
function overlay() {
  if (!renderer || S.city) return;
  const svg = document.getElementById("feedlines"); svg.setAttribute("viewBox", "0 0 " + innerWidth + " " + innerHeight);
  const feeds = filtered().slice(-8);
  const want = {}; feeds.forEach(f => want[f.id] = f);
  Object.keys(cardEls).forEach(id => { if (!want[id]) { cardEls[id].remove(); delete cardEls[id]; } });
  const camDir = camera.position.clone().normalize();
  const panelW = document.getElementById("leftpanel").classList.contains("collapsed") ? 0 : 300;
  let lines = "";
  feeds.forEach(f => {
    const surf = llToVec(f.lat, f.lon, R * 1.02);
    const visible = surf.clone().normalize().dot(camDir) > 0.18;
    const ndc = surf.clone().project(camera);
    const sx = (ndc.x * .5 + .5) * innerWidth, sy = (-ndc.y * .5 + .5) * innerHeight;
    let el = cardEls[f.id];
    if (!el) { el = buildFeedCard(f); cardEls[f.id] = el; document.getElementById("feeds").appendChild(el); }
    const show = visible && sx > panelW + 36 && ndc.z < 1;
    el.style.opacity = show ? "1" : "0";
    if (el._video) { if (show && el._video.paused) el._video.play().catch(() => {}); else if (!show && !el._video.paused) el._video.pause(); }
    if (show) {
      const cx = Math.min(innerWidth - 130, Math.max(panelW + 130, sx + 90)), cy = Math.min(innerHeight - 110, Math.max(90, sy - 70));
      el.style.left = cx + "px"; el.style.top = cy + "px";
      lines += `<line x1="${cx}" y1="${cy}" x2="${sx}" y2="${sy}" stroke="rgba(231,141,56,0.5)" stroke-width="1" stroke-dasharray="3 3"/><circle cx="${sx}" cy="${sy}" r="2.6" fill="#E78D38"/>`;
    }
  });
  svg.innerHTML = lines;
}
function animate() {
  requestAnimationFrame(animate);
  if (controls) { controls.autoRotate = S.autoRotate && !S.city; controls.update(); }
  if (renderer && !S.city) renderer.render(scene, camera);
  overlay();
}

/* ---------------- Inspector (enlarged video) ---------------- */
function openInspector(f) {
  const m = document.getElementById("inspector");
  m.innerHTML = `<div class="insp-card">
    <div class="insp-top"><span>${esc(f.source)} · ${esc(f.city)} · ${esc(f.category)}</span><span style="cursor:pointer;color:var(--faint)" onclick="NIAN.closeInspector()">✕</span></div>
    <video id="insp-video" src="${esc(f.video)}" controls autoplay playsinline style="width:100%;background:#000;display:block;max-height:60vh"></video>
    <div class="insp-ctrls"><button onclick="NIAN.frame(-1)">⏴ image</button><button onclick="NIAN.frame(1)">image ⏵</button></div>
    <div class="insp-meta"><div class="cap2">${esc(f.text)}</div><div class="auth">Auteur : ${esc(f.author || "—")}</div><div>${fmtTs(f.ts)}</div>${f.url ? `<a href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">Ouvrir la source ↗</a>` : ""}</div>
  </div>`;
  m.classList.add("show");
  const v = document.getElementById("insp-video"); if (v) { v.muted = false; v.play().catch(() => {}); }
}
window.NIAN = {
  closeInspector: () => { const m = document.getElementById("inspector"); const v = document.getElementById("insp-video"); if (v) v.pause(); m.classList.remove("show"); m.innerHTML = ""; },
  frame: (d) => { const v = document.getElementById("insp-video"); if (v) { v.pause(); v.currentTime = Math.max(0, v.currentTime + d * (1 / 30)); } }
};

/* ---------------- Left panel ---------------- */
function selectCity(city) {
  const feeds = (window.INDICE_GEO_CONFIG.feeds || []).filter(f => f.city === city);
  const bySrc = {}; feeds.forEach(f => bySrc[f.source] = (bySrc[f.source] || 0) + 1);
  const rank = Object.keys(bySrc).sort((a, b) => bySrc[b] - bySrc[a]).map(s => `<div class="srcrow"><span>${esc(s)}</span><span style="color:var(--accent)">${bySrc[s]}</span></div>`).join("") || "<div style='color:var(--faint);font-size:11px'>—</div>";
  document.getElementById("lpbody").innerHTML = `<div class="lp-title">${esc(city.toUpperCase())}</div>
    <div class="lp-h">RÉSUMÉ</div><div style="font-size:11px;color:var(--faint)">${feeds.length} flux détectés sur cette ville.</div>
    <div class="lp-h">CLASSEMENT DES SOURCES</div>${rank}
    <div class="lp-h">DERNIERS FLUX</div>${feeds.slice(-4).reverse().map(f => `<div style="font-size:10px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.07)"><span style="color:var(--accent)">${esc(f.source)}</span> · ${esc(f.category)}<br><span style="color:var(--faint)">${esc(fmtTs(f.ts))}</span></div>`).join("")}`;
  document.getElementById("leftpanel").classList.remove("collapsed");
  document.getElementById("panelToggle").classList.add("shift");
}

/* ---------------- City tactical view ---------------- */
function openCity(city) {
  const c = window.INDICE_GEO_CONFIG.cities[city]; if (!c) return;
  S.city = city; selectCity(city);
  document.getElementById("cityname").textContent = city.toUpperCase();
  const W = innerWidth, H = innerHeight, cx = W / 2, cy = H / 2, svg = document.getElementById("citysvg");
  svg.setAttribute("viewBox", "0 0 " + W + " " + H);
  let g = "";
  for (let x = 0; x <= W; x += 64) g += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="rgba(116,165,204,0.07)"/>`;
  for (let y = 0; y <= H; y += 64) g += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="rgba(116,165,204,0.07)"/>`;
  for (let r = 120; r < Math.max(W, H); r += 150) g += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(231,141,56,0.09)"/>`;
  g += `<line x1="${cx - 20}" y1="${cy}" x2="${cx + 20}" y2="${cy}" stroke="#E78D38"/><line x1="${cx}" y1="${cy - 20}" x2="${cx}" y2="${cy + 20}" stroke="#E78D38"/>`;
  svg.innerHTML = g;
  const marks = document.getElementById("citymarks"); marks.innerHTML = "";
  (window.INDICE_GEO_CONFIG.feeds || []).filter(f => f.city === city).forEach(f => {
    const px = Math.min(W - 140, Math.max(140, cx + (f.lon - c.lon) * 3200)), py = Math.min(H - 110, Math.max(120, cy - (f.lat - c.lat) * 3200));
    const el = buildFeedCard(f); el.style.left = px + "px"; el.style.top = py + "px"; marks.appendChild(el);
  });
  document.getElementById("cityview").classList.add("show");
}
function backGlobe() { S.city = null; const m = document.getElementById("citymarks"); if (m) m.innerHTML = ""; document.getElementById("cityview").classList.remove("show"); }

/* ---------------- Counters ---------------- */
function counters() {
  const by = {}; filtered().forEach(f => by[f.category] = (by[f.category] || 0) + 1);
  const cfg = window.INDICE_GEO_CONFIG;
  document.getElementById("bottombar").innerHTML = cfg.categories.map(c => `<span class="cnt" style="color:${cfg.catColor[c]}">${esc(c)} <b>${by[c] || 0}</b></span>`).join("") + `<span class="cnt">TOTAL <b style="color:var(--accent)">${filtered().length}</b></span>`;
}

/* ---------------- Public API ---------------- */
function updateFeeds(items) {
  if (S.frozen || !items) return;
  const arr = window.INDICE_GEO_CONFIG.feeds, seen = {}; arr.forEach(f => seen[f.id] = 1);
  (Array.isArray(items) ? items : [items]).forEach(it => { if (it && it.id && !seen[it.id]) arr.push(it); });
  if (arr.length > 60) window.INDICE_GEO_CONFIG.feeds = arr.slice(-60);
  rebuildActivity(); counters();
}
window.updateFeeds = updateFeeds;

/* ---------------- Boot ---------------- */
function fillCitySelect() { const sel = document.getElementById("citysel"); Object.keys(window.INDICE_GEO_CONFIG.cities).forEach(c => { const o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); }); }
function wireUI() {
  document.getElementById("catsel").addEventListener("change", () => { rebuildActivity(); counters(); });
  document.getElementById("citysel").addEventListener("change", e => { rebuildActivity(); counters(); if (e.target.value !== "all") openCity(e.target.value); });
  document.getElementById("timesel").addEventListener("change", () => { rebuildActivity(); counters(); });
  document.getElementById("freezebtn").addEventListener("click", e => { S.frozen = !S.frozen; e.target.classList.toggle("on", S.frozen); e.target.textContent = S.frozen ? "FIGÉ" : "FREEZE"; });
  document.getElementById("orbitbtn").addEventListener("click", e => { S.autoRotate = !S.autoRotate; e.target.textContent = "ORBITE : " + (S.autoRotate ? "LENTE" : "PAUSE"); });
  document.getElementById("panelToggle").addEventListener("click", () => { const p = document.getElementById("leftpanel"); p.classList.toggle("collapsed"); document.getElementById("panelToggle").classList.toggle("shift", !p.classList.contains("collapsed")); });
  document.getElementById("backglobe").addEventListener("click", backGlobe);
  document.getElementById("inspector").addEventListener("click", e => { if (e.target.id === "inspector") window.NIAN.closeInspector(); });
  addEventListener("keydown", e => { if (e.key === "Escape") { if (document.getElementById("inspector").classList.contains("show")) window.NIAN.closeInspector(); else if (S.city) backGlobe(); } });
  document.getElementById("panelToggle").classList.add("shift");
}
function startStream() { try { const es = new EventSource("/api/geospatial/stream"); es.onmessage = ev => { try { updateFeeds(JSON.parse(ev.data)); } catch (e) {} }; es.onerror = () => {}; } catch (e) {} }
(function boot() {
  if (typeof THREE === "undefined") { document.body.insertAdjacentHTML("beforeend", "<div style='position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e5443b'>Three.js non chargé (connexion CDN requise).</div>"); return; }
  fillCitySelect(); wireUI(); counters();
  fetch("/world.geojson").then(r => r.json()).then(geo => initThree(geo)).catch(() => initThree({ features: [] }));
  fetch("/api/geospatial/snapshot").then(r => r.json()).then(d => updateFeeds(d.items || [])).catch(() => {});
  startStream();
})();
</script>
</body>
